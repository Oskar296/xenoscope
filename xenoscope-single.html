<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>XENOSCOPE · Field Xenobiology</title>
<style>
:root{
  --bg0:#04090d; --glass:rgba(9,20,26,.62);
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --ink:#e8f6f4; --dim:#7fa0a4; --dim2:#557077;
  --aqua:#5ef2d6; --mint:#7effc0; --violet:#b79bff;
  --amber:#ffcf6a; --coral:#ff7d92; --magenta:#ff5ec7;
  --good:#57e6a8; --bad:#ff6a6a; --warn:#ffc46b;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  --mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0)}
body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
b{font-weight:600}
.muted{color:var(--dim2)} .hl{color:var(--ink)} .rk{color:var(--coral)}

.panel{position:fixed;background:var(--glass);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);backdrop-filter:blur(16px) saturate(1.25);
  border:1px solid var(--line);border-radius:18px;
  box-shadow:0 14px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);z-index:5}
.cap{font-size:10.5px;letter-spacing:2.4px;color:var(--dim);text-transform:uppercase;margin-bottom:12px}

/* top bar */
#top{top:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:9px 14px;max-width:97vw;flex-wrap:wrap}
#top .sid{font-family:var(--mono);font-size:12px;color:var(--aqua);white-space:nowrap}
#top .name{font-size:13px;font-weight:600;white-space:nowrap}
#top .name.unk{color:var(--dim2);font-style:italic;font-weight:400}
.kchip{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--aqua);border:1px solid rgba(94,242,214,.35);border-radius:6px;padding:2px 7px;text-transform:uppercase}
.chip{padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1.2px;white-space:nowrap;border:1px solid transparent}
.chip.good{color:var(--mint);background:rgba(94,242,214,.09);border-color:rgba(94,242,214,.4)}
.chip.bad{color:var(--coral);background:rgba(255,94,120,.09);border-color:rgba(255,125,146,.4)}
.chip.neutral{color:var(--warn);background:rgba(255,196,107,.09);border-color:rgba(255,196,107,.4)}
#top .obj2{font-size:10.5px;color:var(--dim);white-space:nowrap}
#top .sep{width:1px;height:20px;background:var(--line)}
.titlewrap{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.topgap{flex:0 0 6px}
.rankpill{display:flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.03);white-space:nowrap}
.rankpill .rk{color:var(--mint);font-size:11.5px;font-weight:600}
.rankpill .xp{color:var(--dim);font-size:10px;font-family:var(--mono)}
.rankpill .xp::after{content:' XP'}
.ibtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);cursor:pointer;font-size:14px;display:grid;place-items:center;transition:.15s}
.ibtn:hover{color:var(--ink);border-color:var(--line2);background:rgba(255,255,255,.07)}

/* left panel */
#left{left:16px;top:50%;transform:translateY(-50%);width:196px;padding:16px 15px;max-height:88vh;overflow-y:auto}
.prog{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin:6px 0 5px}
.prog b{color:var(--ink);font-family:var(--mono)}
.track{height:6px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;position:relative}
.track>i{position:absolute;top:0;bottom:0;left:0;border-radius:6px;transition:width .3s}
.hintbox{margin:12px 0;font-size:11px;line-height:1.5;color:var(--dim);background:rgba(94,242,214,.05);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.btn.wide{width:100%;margin-top:4px}
.ring{position:relative;width:120px;height:120px;margin:2px auto 10px}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .rval{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1;pointer-events:none}
.ring .num{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ring .rlab{font-size:8.5px;letter-spacing:1.6px;color:var(--dim);margin-top:5px;font-weight:600}
.bar{margin-top:11px}
.bar .bl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-bottom:5px}
.bar .bl b{color:var(--ink);font-family:var(--mono);font-size:11px}
.homeo{height:6px;border-radius:6px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.homeo .mid{position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:rgba(255,255,255,.25)}
.homeo>i{position:absolute;top:0;bottom:0;left:50%;width:0;border-radius:4px;transition:.25s}

/* right panel */
#right{right:16px;top:50%;transform:translateY(-50%);width:250px;max-height:80vh;overflow:auto;padding:16px 15px}
.readout{font-size:12px;line-height:1.55;color:var(--dim)}
.readout .ro-name{color:var(--ink);font-weight:600;font-size:13px;margin-bottom:4px}
.readout .ro-fn{color:var(--dim);margin-bottom:6px}
.readout .ro-fact{color:var(--aqua);font-size:11px;line-height:1.5}
.dossier{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.dl-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);padding:4px 0;font-family:var(--mono)}
.dl-row b{color:var(--ink)}

/* dock */
#dock{bottom:16px;left:50%;transform:translateX(-50%);padding:12px 16px;display:flex;gap:16px;align-items:stretch;max-width:96vw;flex-wrap:wrap}
.dock-lab{font-size:9.5px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;margin-bottom:7px}
.dock-tests{align-items:center;gap:10px}
.dock-tests .dock-lab{margin:0 6px 0 0}
.dock-note{font-size:11px;color:var(--dim2);margin-left:8px}
.dock-col{display:flex;flex-direction:column;gap:8px;justify-content:center}
.dock-group{max-width:340px}
.btn-row{display:flex;gap:7px;flex-wrap:wrap}
.dsep{width:1px;background:var(--line)}
.sldwrap{width:180px}
.sldwrap .sh{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:6px}
.sldwrap .sh b{color:var(--ink);font-family:var(--mono)}
.sldtrack{position:relative;height:22px}
.optzone{position:absolute;top:8px;height:7px;border-radius:5px;background:linear-gradient(90deg,rgba(94,242,214,0),rgba(94,242,214,.45),rgba(94,242,214,0));box-shadow:0 0 8px rgba(94,242,214,.4);display:none;pointer-events:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;cursor:pointer;position:relative;z-index:2;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:rgba(255,255,255,.14);margin-top:9px}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:rgba(255,255,255,.14)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--ink);margin-top:-6px;box-shadow:0 0 0 4px rgba(94,242,214,.18),0 2px 8px #000a}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:none;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px rgba(94,242,214,.18),0 2px 8px #000a}
.abtn{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;padding:7px 10px;font-size:11px;font-weight:600;text-align:left;transition:.14s;min-width:96px}
.abtn small{display:block;font-weight:400;font-size:9px;color:var(--dim);margin-top:1px}
.abtn:hover{border-color:var(--line2);background:rgba(255,255,255,.08)}
.abtn.used{border-color:rgba(94,242,214,.4)}
.abtn .lvl{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--aqua);transition:width .25s}
.abtn.treat .lvl{background:var(--mint)}

/* hover tooltip */
#zlab{position:fixed;z-index:7;pointer-events:none;transform:translate(-50%,-150%);font-size:11px;letter-spacing:.5px;color:var(--ink);background:rgba(4,10,13,.75);border:1px solid var(--line2);border-radius:8px;padding:4px 9px;opacity:0;transition:opacity .12s;white-space:nowrap;font-family:var(--mono)}
#zlab.on{opacity:1} #zlab .s{color:var(--dim);font-size:10px}

/* overlay + cards */
.overlay{position:fixed;inset:0;z-index:20;display:none;place-items:center;overflow:auto;background:radial-gradient(900px 600px at 50% 42%,rgba(6,18,24,.85),rgba(3,7,10,.96))}
.overlay.on{display:grid}
.card{width:min(600px,92vw);margin:24px;padding:26px 28px;border-radius:22px;background:linear-gradient(180deg,rgba(12,24,30,.95),rgba(7,15,20,.97));border:1px solid var(--line2);box-shadow:0 30px 100px #000b,inset 0 1px 0 rgba(255,255,255,.06)}
.card .sub{color:var(--dim);font-size:11.5px;letter-spacing:2px;text-transform:uppercase}
.card h1{margin:6px 0 6px;font-size:30px;letter-spacing:5px;font-weight:800}
.card h1 .x{color:var(--aqua)} .card h1 .o{color:var(--violet)}
.card h2{margin:4px 0 8px;font-size:20px;font-weight:700}
.card p{color:var(--dim);line-height:1.6;font-size:13px} .card p b{color:var(--ink)}
.rankcard{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:14px 0;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.02);flex-wrap:wrap}
.rk-big{font-size:16px;font-weight:700;color:var(--mint)}
.rk-stats{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--dim);font-family:var(--mono)}
.tiers{display:flex;gap:8px;flex-wrap:wrap}
.tierbtn{flex:1;min-width:150px;text-align:left;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;padding:9px 11px;font-size:12.5px;font-weight:700;transition:.14s}
.tierbtn small{display:block;font-weight:400;font-size:10.5px;color:var(--dim);margin-top:3px;line-height:1.35}
.tierbtn:hover{border-color:var(--line2)}
.tierbtn.sel{border-color:var(--aqua);box-shadow:0 0 0 1px var(--aqua),0 0 20px rgba(94,242,214,.2)}
.cta{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:12px;border:1px solid var(--line2);cursor:pointer;background:rgba(255,255,255,.04);color:var(--ink);font-size:13px;font-weight:600;transition:.15s}
.btn:hover{background:rgba(255,255,255,.09)}
.btn.pri{background:linear-gradient(90deg,#1c8f7a,#2fc4a6);border-color:#2fc4a6;color:#032019;font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--dim)}
.classgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}
.classbtn{padding:14px 8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;font-size:13px;font-weight:600;transition:.14s}
.classbtn:hover{border-color:var(--aqua);background:rgba(94,242,214,.06)}
.classbtn.wrong{border-color:var(--coral);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.brief-row{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);padding:5px 0;border-bottom:1px solid var(--line)}
.brief-row b{color:var(--ink)}
.assign{display:flex;align-items:center;gap:10px;margin:14px 0}
.assign-obj{font-size:13px;color:var(--ink)}
.verdict{font-size:30px;font-weight:800;letter-spacing:2px;margin:4px 0 6px}
.verdict.win{color:var(--mint)} .verdict.lose{color:var(--coral)}
.rankup{margin:10px 0;padding:9px 12px;border:1px solid rgba(126,255,192,.35);border-radius:10px;background:rgba(126,255,192,.07);color:var(--mint);font-size:12.5px}
.xp-list{margin:10px 0;display:flex;flex-direction:column;gap:3px}
.xp-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.xp-row b{color:var(--mint)}
.rev{font-size:11.5px;color:var(--dim);font-family:var(--mono);border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.cx-tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.cx-tab{padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--dim);cursor:pointer;font-size:11.5px;font-weight:600}
.cx-tab.sel{border-color:var(--aqua);color:var(--ink)}
.cx-list{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.cx{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:rgba(255,255,255,.02)}
.cx.locked{opacity:.5}
.cx-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600}
.cx-dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 8px currentColor}
.cx-fn{font-size:11px;color:var(--dim);line-height:1.5;margin-top:5px}
.cx-fact{font-size:10.5px;color:var(--aqua);margin-top:4px;line-height:1.5}

/* new bits: learn-more, earth tag, fact box, deeper note, assay row */
.learn{color:var(--aqua);text-decoration:none;border-bottom:1px dotted var(--aqua);white-space:nowrap;font-size:.95em}
.learn:hover{color:var(--mint);border-bottom-style:solid}
.earthtag{font-size:10px;letter-spacing:.5px;color:#9fe0b0;border:1px solid rgba(120,230,160,.4);border-radius:6px;padding:2px 7px;background:rgba(120,230,160,.08);white-space:nowrap}
.factbox{margin:10px 0;padding:9px 11px;border:1px solid rgba(120,230,160,.28);border-radius:10px;background:rgba(120,230,160,.06);color:var(--dim);font-size:12px;line-height:1.55}
.factbox .learn{margin-left:4px}
.ro-more{font-size:11px;color:var(--dim);line-height:1.55;margin:6px 0}
.tests-row{max-height:120px;overflow:auto}
.only-mobile{display:none}

/* ---------- mobile / touch ---------- */
@media (max-width:900px){
  #top{max-width:98vw;gap:8px;padding:8px 10px;z-index:22}
  #top .obj2,#top .sep,.rankpill{display:none}
  .only-mobile{display:grid}
  /* side panels become slide-in drawers (below the top bar) */
  #left,#right{top:94px;bottom:128px;transform:none;width:min(300px,84vw);max-height:none;overflow:auto;transition:transform .25s ease;z-index:14}
  #left{left:10px;transform:translateX(calc(-100% - 20px))}
  #right{right:10px;transform:translateX(calc(100% + 20px))}
  #left.open{transform:translateX(0)}
  #right.open{transform:translateX(0)}
  /* dock: full-width, horizontally scrollable groups */
  #dock{left:0;right:0;bottom:0;transform:none;width:100vw;max-width:100vw;border-radius:16px 16px 0 0;
        flex-direction:column;gap:8px;padding:10px 12px;max-height:46vh;overflow:auto}
  .dock-col{flex-direction:row;flex-wrap:wrap;gap:10px}
  .sldwrap{width:44vw;min-width:150px}
  .dsep{display:none}
  .btn-row{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .tests-row{max-height:none;flex-wrap:nowrap;overflow-x:auto}
  .abtn{min-width:112px;flex:0 0 auto}
  .card{padding:22px 20px}
  .classgrid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:900px) and (min-width:561px){ .btn-row.agents{flex-wrap:wrap} }

/* ---------- home screen ---------- */
.tagline{color:var(--ink);font-size:14px;line-height:1.5;margin:2px 0 14px;opacity:.94}
.tagline b{color:var(--mint)}
.how{display:flex;gap:9px;margin:0 0 15px;flex-wrap:wrap}
.how-step{flex:1;min-width:150px;display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:rgba(255,255,255,.02)}
.how-ico{font-size:19px;line-height:1}
.how-step b{font-size:12.5px} .how-step small{display:block;color:var(--dim);font-size:10.5px;margin-top:2px;line-height:1.35}
.rk-left{flex:1;min-width:180px}
.xpbar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px;max-width:240px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,#1c8f7a,var(--mint))}
.lbl{margin:12px 0 6px;font-size:11px;letter-spacing:1px}

/* ---------- persistent notes (top-left readout) ---------- */
.notes-cap{margin:0 0 8px}
.rl-sep{height:1px;background:var(--line);margin:12px 0}
#left .readout{max-height:210px;overflow:auto}
.readout .ro-name{animation:pop .25s ease}
@keyframes pop{from{transform:scale(.9);opacity:.4}to{transform:scale(1);opacity:1}}

/* ---------- lighter overlays so the live specimen shows through ---------- */
.overlay{background:radial-gradient(760px 520px at 50% 42%,rgba(6,18,24,.70),rgba(3,7,10,.92))}
.card{animation:cardIn .25s ease}
@keyframes cardIn{from{transform:translateY(10px) scale(.99);opacity:0}to{transform:none;opacity:1}}

/* ---------- deduction UI: analysis panel, assays, identify ---------- */
.th{font-size:12px;font-weight:600;border-radius:9px;padding:7px 9px;margin-bottom:2px;border:1px solid var(--line);line-height:1.4}
.th.bad{color:var(--coral);background:rgba(255,120,90,.08);border-color:rgba(255,120,90,.3)}
.th.good{color:var(--mint);background:rgba(94,242,214,.06);border-color:rgba(94,242,214,.25)}
.th.muted{color:var(--dim);background:rgba(255,255,255,.02)}
.ev-list{display:flex;flex-direction:column;gap:4px;margin-top:2px}
.ev-row{font-size:11.5px;color:var(--ink);line-height:1.45;background:rgba(255,255,255,.03);border-left:2px solid rgba(94,242,214,.45);padding:4px 8px;border-radius:0 6px 6px 0}
.abtn.assay b{color:var(--aqua)}
.abtn.assay.used{border-color:rgba(94,242,214,.4);background:rgba(94,242,214,.06)}
.abtn.assay.used b::after{content:' ✓';color:var(--mint)}
.abtn.assay.dis{opacity:.4;filter:grayscale(.5)}
/* step tracker + active-group cueing */
.stepbar{flex:0 0 100%;display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:9px;flex-wrap:wrap}
.stepchip{font-size:10.5px;font-weight:600;color:var(--dim);padding:3px 10px;border:1px solid var(--line);border-radius:20px;background:rgba(255,255,255,.02);white-space:nowrap}
.stepchip.on{color:var(--ink);border-color:var(--aqua);background:rgba(94,242,214,.1);box-shadow:0 0 0 1px var(--aqua),0 0 14px rgba(94,242,214,.22)}
.stepchip.done{color:var(--mint);border-color:rgba(94,242,214,.3)}
.steparr{color:var(--dim2);font-size:11px}
.dock-group.active{border:1px solid rgba(94,242,214,.32);border-radius:12px;padding:6px 9px;background:rgba(94,242,214,.04);box-shadow:0 0 16px rgba(94,242,214,.12)}
.dock-group.active .dock-lab{color:var(--aqua)}
/* advanced mode · the synthesis bench */
.abtn.synthopen{min-width:150px;border-color:var(--violet)}
.abtn.synthopen b{color:var(--violet)}
.bench-card{width:min(940px,96vw)!important}
.bench-dx{font-size:13px;color:var(--dim);border:1px solid var(--line2);border-left:3px solid var(--violet);border-radius:8px;padding:8px 12px;margin:2px 0 12px;background:rgba(140,110,240,.06)}
.bench-dx b{color:var(--ink)}
.benchwrap{display:flex;gap:16px;align-items:stretch}
.bench-col{flex:1;min-width:0;display:flex;flex-direction:column}
.bench-col .cap{margin-bottom:7px}
.bench-col.flaskcol{flex:0 0 246px;align-items:center;justify-content:flex-start}
#benchCv{position:static!important;inset:auto!important;width:240px!important;height:272px!important;touch-action:auto;filter:drop-shadow(0 12px 26px rgba(0,0,0,.5))}
.flask-label{margin-top:4px;font-size:12.5px;font-weight:700;text-align:center;min-height:18px;color:var(--ink)}
.flask-label.ok{color:var(--mint)} .flask-label.muted{color:var(--dim);font-weight:500}
.ing-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:296px;overflow:auto;padding-right:3px}
.ingt{display:flex;align-items:center;gap:7px;text-align:left;border:1px solid var(--line2);border-radius:10px;background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;padding:7px 8px;transition:.14s}

.step-grid{display:flex;flex-direction:column;gap:7px}
.stept{display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--line2);border-radius:10px;background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;padding:9px 11px;transition:.14s}
.stepglyph{font-size:19px;line-height:1}
.steptx b{display:block;font-size:12.5px;font-weight:700}
.steptx small{display:block;font-size:10px;color:var(--dim);margin-top:1px;line-height:1.3}
.stept:hover{border-color:var(--violet);background:rgba(140,110,240,.08)}
.stept.sel{border-color:var(--violet);background:rgba(140,110,240,.16);box-shadow:0 0 0 1px var(--violet)}
.bench-read{margin-top:11px;font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.02);min-height:52px}
.bench-read.ok{color:var(--mint);border-color:rgba(94,242,214,.3);background:rgba(94,242,214,.05)}
.bench-read.bad{color:var(--coral);border-color:rgba(255,120,90,.3);background:rgba(255,120,90,.05)}
.bench-read b{color:var(--ink)} .bench-read .muted{color:var(--dim);margin-top:4px;font-size:11.5px}
.bench-test{display:flex;gap:12px;align-items:center;margin-top:12px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:rgba(0,0,0,.22)}
#sampleCv{position:static!important;inset:auto!important;flex:0 0 300px;width:300px!important;height:86px!important;touch-action:auto}
.bench-testtx{font-size:12.5px;color:var(--dim);line-height:1.5}
.bench-testtx b.ok,.bench-read b.ok{color:var(--mint)} .bench-testtx b.bad,.bench-read b.bad{color:var(--coral)}
.bench-cta{flex-wrap:wrap} .btn.ghost{opacity:.75}
@media(max-width:720px){ .benchwrap{flex-direction:column} .bench-col.flaskcol{flex:0 0 auto;order:-1} .ing-grid{max-height:none} .bench-test{flex-direction:column} #sampleCv{flex:0 0 auto} }
.btn.pri[disabled]{opacity:.4;cursor:default;filter:grayscale(.4)}
/* outbreak · arcade run */
.btn.ob{border-color:var(--violet);color:#dcccff;background:linear-gradient(180deg,rgba(140,110,240,.18),rgba(140,110,240,.06))}
.btn.ob:hover{border-color:#b49cff;box-shadow:0 0 0 1px rgba(180,156,255,.4),0 0 18px rgba(140,110,240,.3)}
#runhud{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:8;display:none;align-items:center;gap:14px;
  padding:7px 14px;border-radius:999px;font-family:var(--mono);font-size:12px;color:var(--ink);
  background:linear-gradient(180deg,rgba(10,20,26,.9),rgba(6,14,18,.92));border:1px solid var(--line2);
  box-shadow:0 10px 30px #0009,inset 0 1px 0 rgba(255,255,255,.05);white-space:nowrap;pointer-events:none}
#runhud b{color:#fff}
.rh-case{font-weight:700;letter-spacing:1px;color:var(--dim)}
.rh-mod{margin-left:4px;padding:1px 6px;border-radius:6px;font-weight:700}
.rh-mod.dbl{color:#ffdf7a;background:rgba(255,210,90,.14)} .rh-mod.rush{color:var(--coral);background:rgba(255,110,90,.15)}
.rh-colony{display:flex;align-items:center;gap:6px} .rh-colony span{color:var(--dim);font-size:10px;letter-spacing:1px}
.rh-bar{width:120px;height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden}
.rh-bar>i{display:block;height:100%;border-radius:5px;transition:width .35s ease}
.rh-combo em{font-style:normal;color:var(--violet)} .rh-combo.hot{color:#ffb454} .rh-combo.hot em{color:#ffb454}
.rh-timer{color:var(--dim)}
@media(max-width:640px){ #runhud{gap:9px;font-size:10.5px;padding:6px 9px;flex-wrap:wrap;max-width:94vw} .rh-bar{width:70px} }
.gradebadge{flex:0 0 auto;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;font-size:30px;font-weight:900;
  font-family:var(--mono);color:#08120f;box-shadow:0 8px 24px #0008}
.gradebadge.gS{background:linear-gradient(160deg,#7ff0c0,#40c88f)} .gradebadge.gA{background:linear-gradient(160deg,#9fe0ff,#5aa8e6)}
.gradebadge.gB{background:linear-gradient(160deg,#ffe08a,#e6b24a)} .gradebadge.gC{background:linear-gradient(160deg,#d7dde2,#a7b0b8)}
.gradebadge.lost{background:linear-gradient(160deg,#ff8a7a,#d1503f);color:#fff;font-size:26px}
.ob-head{display:flex;align-items:center;gap:14px;margin:6px 0 10px}
.ob-gain{font-size:30px;font-weight:800;color:var(--mint);margin:4px 0 12px} .ob-gain.lost{color:var(--coral);font-size:22px}
.ob-gain small{display:block;font-size:12px;font-weight:500;color:var(--dim);margin-top:3px}
.ob-stats{display:flex;gap:10px;margin-bottom:12px}
.ob-stat{flex:1;border:1px solid var(--line2);border-radius:12px;padding:9px 12px;background:rgba(255,255,255,.03)}
.ob-stat span{display:block;font-size:11px;color:var(--dim)} .ob-stat b{font-size:18px} .ob-stat em{font-style:normal;color:var(--violet);font-size:14px}
.ob-colonywrap{margin-bottom:4px}
.ob-track{height:12px;border-radius:7px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:5px}
.ob-track>i{display:block;height:100%;border-radius:7px;transition:width .4s ease}
.ob-final{text-align:center;margin:14px 0}
.ob-finalscore{font-size:52px;font-weight:900;letter-spacing:1px;line-height:1;color:var(--mint)}
.ob-finalscore small{display:block;font-size:13px;font-weight:500;letter-spacing:3px;color:var(--dim);margin-top:6px}
.ob-finalgrid{display:flex;gap:10px;margin-top:16px}
.ob-finalgrid>div{flex:1;border:1px solid var(--line2);border-radius:12px;padding:10px;background:rgba(255,255,255,.03)}
.ob-finalgrid b{display:block;font-size:22px} .ob-finalgrid span{font-size:11px;color:var(--dim)}
/* field formulary · in-game recipe guide */
.btn.help{border-color:var(--violet);color:#dcccff}
.fm-steps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
.fm-step{font-size:11.5px;color:var(--dim);border:1px solid var(--line2);border-radius:9px;padding:6px 10px;background:rgba(255,255,255,.02)}
.fm-step b{color:var(--violet)} .fm-step small{color:var(--faint,var(--dim))}
.fm-sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:16px;font-weight:800;margin:20px 0 4px;letter-spacing:-.01em}
.fm-sec-h em{font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:999px;font-weight:700}
.fm-sec-h em.save{color:#04120c;background:var(--mint)} .fm-sec-h em.kill{color:#1a0605;background:var(--coral)}
.fm-row{display:flex;gap:14px;padding:11px 2px;border-top:1px solid var(--line)}
.fm-row.match{background:linear-gradient(90deg,rgba(94,242,214,.10),transparent 80%);border-radius:10px;box-shadow:inset 3px 0 0 var(--aqua);padding-left:11px}
.fm-row.kill.match{background:linear-gradient(90deg,rgba(255,120,90,.10),transparent 80%);box-shadow:inset 3px 0 0 var(--coral)}
.fm-target{flex:0 0 116px;font-size:15px;font-weight:800}
.fm-target span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;margin-top:3px}
.fm-tag{display:block;font-style:normal;font-size:10.5px;color:var(--aqua);font-weight:700;margin-top:5px}
.fm-row.kill .fm-tag{color:var(--coral)}
.fm-recipes{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center}
.fm-recipe{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.fm-chip{font-family:var(--mono);font-size:11.5px;font-weight:600;padding:5px 9px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:1px solid transparent}
.fm-chip .fm-d{width:9px;height:9px;border-radius:50%;flex:0 0 9px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.fm-chip.mat{background:rgba(255,255,255,.05);border-color:var(--line2);color:var(--ink)}
.fm-chip.step{background:rgba(140,110,240,.16);border-color:rgba(140,110,240,.4);color:#dcccff}
.fm-chip.drug{background:rgba(94,242,214,.14);border-color:rgba(94,242,214,.42);color:#aef7e7;font-weight:700}
.fm-row.kill .fm-chip.drug{background:rgba(255,122,107,.15);border-color:rgba(255,122,107,.45);color:#ffc2b8}
.fm-op{color:var(--faint,var(--dim));font-weight:700;font-family:var(--mono);font-size:12px}
.fm-chip.temp{background:rgba(255,180,84,.14);border-color:rgba(255,180,84,.45);color:#ffcf8a;font-weight:700}
.fm-chip.ph{background:rgba(140,200,255,.14);border-color:rgba(140,200,255,.45);color:#a9d8ff;font-weight:700;margin-left:4px}
.tempval.phval{color:#8fc8ff}
.tempdial.phdial{background:linear-gradient(90deg,#ff5a3a 0%,#ffb454 22%,#7fe0a6 50%,#5aa8e6 74%,#b49cff 100%)}
.fm-sec-h em.pre{color:#1a1030;background:var(--violet)}
.fm-hint{font-size:12.5px;color:var(--ink);line-height:1.5;padding:7px 0}
.fm-hint b{color:var(--aqua)}
.fm-hintcond{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:3px}
.fm-why{font-size:11.5px;color:var(--dim);line-height:1.45;margin-top:2px}
.fm-why b{color:#ffb454}
@media(max-width:640px){ .fm-row{flex-direction:column;gap:7px} .fm-target{flex:0 0 auto} }
/* ultra mode · named real pathogens */
.chip.ultra{background:linear-gradient(180deg,rgba(140,110,240,.24),rgba(140,110,240,.10));color:#dcccff;border:1px solid rgba(180,156,255,.5);font-weight:700}
.tierbtn.ultra{position:relative}
.tierbtn.ultra b{color:var(--violet)}
.tierbtn.ultra.sel{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet),0 0 22px rgba(140,110,240,.3)}
.rev.ultra{border-color:rgba(180,156,255,.35);background:rgba(140,110,240,.06)}
.rev.ultra .hl{color:#cdbbff}
/* precision bench · temperature dial + intermediates */
.tempwrap{margin-top:12px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:rgba(255,255,255,.02)}
.tempwrap .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.tempval{font-family:var(--mono);font-size:14px;font-weight:800;color:#ffb454;letter-spacing:0}
.tempdial{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:5px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,#5aa8e6 0%,#7fe0a6 28%,#ffd27a 60%,#ff8a4a 82%,#ff5a3a 100%)}
.tempdial::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;
  border:2px solid #0a1218;box-shadow:0 2px 8px #000a;cursor:pointer}
.tempdial::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #0a1218;box-shadow:0 2px 8px #000a;cursor:pointer}
.temphint{margin-top:7px;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.temphint .ok{color:var(--mint);font-weight:700} .temphint .bad{color:var(--coral);font-weight:700}
.temphint b{color:#ffb454}
.ingtx em{display:block;font-style:normal;font-size:9.5px;color:var(--violet);font-weight:700;margin-top:2px}
.ingt.locked{opacity:.55}
.ingt.locked .ingtx em{color:var(--dim)}
.ingt.locked:hover{border-color:var(--coral);background:rgba(255,120,90,.06)}
.btn.pre{border-color:var(--violet);color:#dcccff;background:linear-gradient(180deg,rgba(140,110,240,.2),rgba(140,110,240,.07))}
.btn.pre[disabled]{opacity:.4;cursor:default}
/* xeno mode · alien biology */
.chip.alien{background:linear-gradient(180deg,rgba(120,240,220,.22),rgba(120,240,220,.08));color:#9ff0ea;border:1px solid rgba(159,240,234,.5);font-weight:700}
.tierbtn.alien b{color:#7ff0e0}
.tierbtn.alien.sel{border-color:#7ff0e0;box-shadow:0 0 0 1px #7ff0e0,0 0 22px rgba(127,240,224,.28)}
.fm-sec-h em.xeno{color:#04201d;background:#7ff0e0}
/* ---- menu · one clear path in ---- */
.card h1{margin:2px 0 10px}
.m-main{margin:18px 0 10px}
.m-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}
.m-card{display:flex;align-items:center;gap:12px;text-align:left;width:100%;cursor:pointer;
  border:1px solid var(--line2);border-radius:14px;padding:13px 15px;color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  transition:border-color .16s,background .16s,transform .16s}
.m-card:hover{border-color:var(--aqua);background:rgba(94,242,214,.07);transform:translateY(-1px)}
.m-card:active{transform:translateY(0)}
.m-card.hero{padding:18px 20px;border-color:rgba(94,242,214,.45);
  background:linear-gradient(180deg,rgba(94,242,214,.13),rgba(94,242,214,.03));
  box-shadow:0 0 0 1px rgba(94,242,214,.2),0 10px 34px rgba(0,0,0,.35)}
.m-card.hero:hover{border-color:var(--aqua);box-shadow:0 0 0 1px var(--aqua),0 0 30px rgba(94,242,214,.22)}
.m-ico{font-size:21px;line-height:1;flex:0 0 auto}
.m-card.hero .m-ico{font-size:29px}
.m-tx{flex:1;min-width:0}
.m-tx b{display:block;font-size:14px;font-weight:700;letter-spacing:.1px}
.m-card.hero .m-tx b{font-size:19px}
.m-tx small{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.m-card.hero .m-tx small{font-size:12.5px;color:var(--mint)}
.m-go{font-size:16px;color:var(--aqua);flex:0 0 auto}
.m-row .m-card{flex-direction:column;align-items:flex-start;gap:7px;padding:13px}
.m-row .m-tx b{font-size:13px}
.m-rank{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:rgba(255,255,255,.02);margin-bottom:14px}
.m-rk{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:7px}
.m-rk b{font-size:14px} .m-rk span{font-size:11.5px;color:var(--dim);font-family:var(--mono)}
.m-rank .xpbar{height:5px}
.m-stats{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--dim);font-family:var(--mono)}
.m-tools{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.m-tool{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:9px 4px;
  border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.02);color:var(--ink);
  font-size:17px;transition:.14s}
.m-tool span{font-size:10px;color:var(--dim);letter-spacing:.3px}
.m-tool:hover{border-color:var(--aqua);background:rgba(94,242,214,.06)}
.m-tool:hover span{color:var(--ink)}
.m-new{margin-top:12px;font-size:12px;color:var(--dim);text-align:center}
.m-new b{color:var(--aqua)}
/* free-play picker */
.pk-list{display:flex;flex-direction:column;gap:7px}
.pk-list.tiers{display:grid;grid-template-columns:repeat(3,1fr)}
.pk{display:flex;align-items:center;gap:11px;text-align:left;width:100%;cursor:pointer;color:var(--ink);
  border:1px solid var(--line2);border-radius:12px;padding:10px 13px;background:rgba(255,255,255,.03);transition:.15s}
.pk{position:relative}
.pk:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
.pk.sel{border-color:var(--aqua);background:rgba(94,242,214,.13);box-shadow:0 0 0 1px var(--aqua),inset 3px 0 0 var(--aqua)}
.pk.sel::after{content:"✓";position:absolute;right:12px;top:50%;transform:translateY(-50%);
  color:var(--aqua);font-weight:800;font-size:15px}
.pk.tier.sel::after{top:12px;transform:none}
.pk-ico{font-size:19px;flex:0 0 24px;text-align:center}
.pk-tx b{display:block;font-size:13.5px;font-weight:700}
.pk-tx small{display:block;font-size:11px;color:var(--dim);margin-top:2px;line-height:1.4}
.pk.tier{flex-direction:column;align-items:flex-start;gap:2px}
@media(max-width:620px){
  .m-row{grid-template-columns:1fr;gap:7px}
  .m-row .m-card{flex-direction:row;align-items:center;gap:11px;padding:11px 13px}
  .m-tools{grid-template-columns:repeat(3,1fr)}
  .pk-list.tiers{grid-template-columns:1fr}

}
/* story · the long survey, a ship's log, not a task list */
.vy-card,.ch-card{width:min(660px,94vw)!important}
.vy-head{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px}
.vy-ship{font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;color:var(--dim)}
.vy-ship b{color:var(--aqua);letter-spacing:.3em}
.vy-title-main{margin:8px 0 12px!important;font-size:27px!important;letter-spacing:-.01em}
.vy-meter{display:flex;align-items:center;gap:11px}
.vy-bar{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.09);overflow:hidden}
.vy-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--aqua),var(--mint));transition:width .4s}
.vy-meter span{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap}
.vy-wrap{max-height:min(56vh,470px);overflow:auto;padding:4px 4px 4px 0;margin-top:6px}
.vy-act{margin-top:20px}
.vy-act:first-child{margin-top:8px}
.vy-acth{display:flex;align-items:baseline;gap:10px;margin-bottom:2px;padding-left:2px}
.vy-num{font-family:var(--mono);font-size:19px;font-weight:800;color:rgba(94,242,214,.28);line-height:1}
.vy-name{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.vy-line{position:relative;padding-left:22px}
.vy-line::before{content:"";position:absolute;left:6px;top:14px;bottom:14px;width:1px;background:var(--line2)}
.vy-ch{position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  border:1px solid transparent;border-radius:11px;padding:10px 12px;background:transparent;color:var(--ink);transition:.15s}
.vy-node{position:absolute;left:-21px;top:50%;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;
  background:var(--bg0);border:2px solid var(--line2)}
.vy-ch.done .vy-node{background:var(--mint);border-color:var(--mint)}
.vy-ch.next .vy-node{background:var(--aqua);border-color:var(--aqua);box-shadow:0 0 0 4px rgba(94,242,214,.18)}
.vy-body{flex:1;min-width:0}
.vy-title{display:block;font-size:14.5px;font-weight:700}
.vy-sub{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.vy-mark{font-size:12px;color:var(--dim)}
.vy-ch.done .vy-title{color:var(--dim);font-weight:600} .vy-ch.done .vy-mark{color:var(--mint)}
.vy-ch.next{border-color:rgba(94,242,214,.35);background:rgba(94,242,214,.07)}
.vy-ch.next .vy-mark{color:var(--aqua)}
.vy-ch.locked{opacity:.35;cursor:default}
.vy-ch:not(.locked):not(.next):hover{background:rgba(255,255,255,.05);border-color:var(--line2)}
/* chapter page */
.ch-head{margin-bottom:4px}
.ch-act{font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--aqua)}
.ch-title{margin:7px 0 0!important;font-size:30px!important;letter-spacing:-.015em;line-height:1.1}
.ch-rule{width:46px;height:2px;background:linear-gradient(90deg,var(--aqua),transparent);margin-top:13px}
.st-p.lede{font-size:16px;color:#f2fbfa;line-height:1.7}
.st-p.lede::first-letter{font-size:200%;line-height:1;float:left;padding:2px 9px 0 0;color:var(--aqua);font-weight:700}

.st-list{display:flex;flex-direction:column;gap:6px;margin:14px 0 4px;max-height:min(52vh,420px);overflow:auto;padding-right:3px}
.st-act{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:12px 0 3px;padding-left:2px}
.st-act:first-child{margin-top:0}
.st-ch{display:flex;align-items:center;gap:11px;text-align:left;border:1px solid var(--line2);border-radius:12px;
  background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;padding:10px 13px;transition:.14s;width:100%}
.st-n{flex:0 0 22px;font-size:14px;text-align:center}
.st-tx b{display:block;font-size:14px;font-weight:700}
.st-tx small{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.st-ch.next{border-color:var(--aqua);background:rgba(94,242,214,.10);box-shadow:0 0 0 1px var(--aqua)}
.st-ch.next .st-n{color:var(--aqua)}
.st-ch.done .st-n{color:var(--mint)} .st-ch.done b{color:var(--dim);font-weight:600}
.st-ch.locked{opacity:.42;cursor:default}
.st-ch:not(.locked):hover{border-color:var(--aqua);background:rgba(94,242,214,.07)}
.st-log{margin:12px 0 6px;max-height:min(46vh,360px);overflow:auto;padding-right:4px}
.st-p{font-size:14px;line-height:1.75;color:var(--ink);margin:0 0 13px;white-space:pre-line}
.st-p i{color:var(--dim)} .st-p b{color:var(--aqua)}
.st-teach{font-family:var(--mono);font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.st-teach b{color:var(--violet)}
.abtn.stand{min-width:140px;border-color:var(--violet)} .abtn.stand b{color:var(--violet)}
.tierbtn.contact b{color:#ffd27a}
.tierbtn.contact.sel{border-color:#ffd27a;box-shadow:0 0 0 1px #ffd27a,0 0 22px rgba(255,210,122,.28)}
/* interactive tutorial coach */
.coach{position:fixed;top:74px;left:50%;transform:translateX(-50%);width:min(600px,94vw);z-index:24;
  background:linear-gradient(180deg,rgba(14,30,34,.97),rgba(9,20,26,.98));border:1px solid var(--aqua);border-radius:16px;
  padding:13px 16px;box-shadow:0 18px 50px #000b,0 0 0 1px rgba(94,242,214,.25),0 0 30px rgba(94,242,214,.16);animation:coachIn .3s ease}
@keyframes coachIn{from{transform:translate(-50%,-8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.coach-h{font-size:13px;font-weight:800;color:var(--aqua);letter-spacing:.3px;margin-bottom:5px}
.coach-d{font-size:12.5px;line-height:1.55;color:var(--ink)}
.coach-d b{color:var(--mint)}
.coach-prog{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap}
.coach-prog .cp{width:14px;height:4px;border-radius:3px;background:rgba(255,255,255,.14)}
.coach-prog .cp.done{background:var(--mint)}
.coach-prog .cp.on{background:var(--aqua);box-shadow:0 0 8px rgba(94,242,214,.5)}
.coach-btns{margin-top:10px;display:flex;justify-content:flex-end;gap:8px}
@media (max-width:900px){ .coach{top:62px;width:94vw;padding:11px 13px} .coach-d{font-size:12px} }
.btn.pulse{border-color:var(--aqua);animation:btnpulse 1.7s ease-in-out infinite}
@keyframes btnpulse{0%,100%{box-shadow:0 0 0 0 rgba(94,242,214,0)}50%{box-shadow:0 0 0 4px rgba(94,242,214,.16),0 0 18px rgba(94,242,214,.3)}}
.abtn.identify{border-color:var(--warn);min-width:118px}
.abtn.identify b{color:var(--warn)}
.idgroup{max-width:150px}
.dx-done{color:var(--mint);font-weight:700;font-size:12px;border:1px solid rgba(94,242,214,.4);border-radius:10px;padding:9px 10px;background:rgba(94,242,214,.07);text-align:center}
.idgrid{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.idopt{flex:1 1 46%;min-width:200px;padding:10px 12px;border:1px solid var(--line2);border-radius:11px;background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;text-align:left;transition:.14s}
.idopt b{display:block;font-size:13px;font-weight:700}
.idopt small{display:block;font-size:10.5px;font-weight:400;color:var(--dim);margin-top:3px;line-height:1.4}
.idopt:hover{border-color:var(--aqua);background:rgba(94,242,214,.07)}
.idopt:hover small{color:var(--ink)}
.idopt.wrong{border-color:var(--coral);animation:shake .3s;opacity:.55}
.idnote{color:var(--coral);font-size:12px;min-height:16px;margin-top:2px}
.card .ev-list{max-height:150px;overflow:auto}
.th.sym{color:var(--warn);background:rgba(255,196,107,.08);border-color:rgba(255,196,107,.32)}
.cmp{border:1px solid rgba(255,196,107,.28);background:rgba(255,196,107,.05);border-radius:10px;padding:7px 9px;margin-top:6px}
.cmp b{font-size:11.5px;color:var(--warn);display:block}
.cmp small{display:block;font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.4}
.cmp-tags{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}
.cmp-tag{font-size:10px;font-weight:600;color:var(--warn);border:1px solid rgba(255,196,107,.35);background:rgba(255,196,107,.08);border-radius:20px;padding:2px 8px;white-space:nowrap}

/* ---------- compact assignment dock (stops covering the cell) ---------- */
.dock-treat{padding:9px 13px;gap:12px;max-height:220px;overflow:auto}
.dock-treat .abtn{padding:5px 9px;min-width:88px;font-size:10.5px}
.dock-treat .abtn small{font-size:8.5px;margin-top:0}
.dock-treat .sldwrap{width:150px}
.dock-treat .sldtrack{height:18px}
.dock-treat .dock-lab{margin-bottom:5px}
.dock-treat .btn-row.agents{max-width:440px}

/* ---------- settings row (menu) ---------- */
.setrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.setlbl{color:var(--dim);font-size:13px}
.setrow input[type=range]{width:140px;height:20px}
.chipbtn{padding:6px 12px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.03);color:var(--dim);cursor:pointer;font-size:11.5px;font-weight:600}
.chipbtn:hover{border-color:var(--line2);color:var(--ink)}
.chipbtn.on{border-color:var(--aqua);color:var(--ink);background:rgba(94,242,214,.08)}
.earthtag.daily{color:#ffd98a;border-color:rgba(255,205,120,.4);background:rgba(255,205,120,.08)}

/* ---------- achievements ---------- */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:56vh;overflow:auto;margin:10px 0}
.ach{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:rgba(255,255,255,.02);opacity:.55}
.ach.got{opacity:1;border-color:var(--line2);background:rgba(94,242,214,.05)}
.ach-ico{font-size:22px;line-height:1}
.ach-n{font-size:12.5px;font-weight:700}
.ach-d{font-size:10.5px;color:var(--dim);margin-top:2px;line-height:1.35}

/* ---------- streak + daily share (result) ---------- */
.streakline{font-size:12px;color:var(--warn);margin:6px 0}
.streakline b{color:var(--ink);font-family:var(--mono)}
.sharebox{margin:10px 0;padding:10px 12px;border:1px solid rgba(255,205,120,.3);border-radius:12px;background:rgba(255,205,120,.05)}
.share-h{font-size:11px;letter-spacing:1px;color:#ffd98a;text-transform:uppercase}
.sharestr{font-family:var(--mono);font-size:12px;color:var(--ink);margin:6px 0 8px;word-break:break-word}

/* ---------- achievement toasts ---------- */
.toastwrap{position:fixed;top:70px;right:16px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{display:flex;gap:11px;align-items:center;min-width:230px;max-width:300px;
  background:linear-gradient(180deg,rgba(14,28,34,.96),rgba(9,18,24,.97));border:1px solid var(--line2);
  border-radius:14px;padding:11px 13px;box-shadow:0 14px 40px #000a, 0 0 0 1px rgba(94,242,214,.15);
  transform:translateX(120%);opacity:0;transition:transform .4s cubic-bezier(.2,1,.3,1),opacity .4s}
.toast.in{transform:none;opacity:1}
.toast .t-ico{font-size:24px;line-height:1;filter:drop-shadow(0 0 6px rgba(255,220,120,.5))}
.toast .t-t{font-size:12.5px;font-weight:700;color:var(--mint)}
.toast .t-d{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.35}
@media (max-width:900px){ .toastwrap{top:auto;bottom:150px;right:8px;left:8px} .toast{max-width:none} }

/* ---------- macro flow: briefing / diagnosis / docks ---------- */
.tagline .gd{color:var(--mint)} .tagline .rk{color:var(--coral)}
.brief{font-size:12.5px;line-height:1.55;color:var(--ink)}
.brief-sub{font-size:11.5px;line-height:1.5;color:var(--dim);margin-top:8px;border-top:1px solid var(--line);padding-top:8px}
.diag{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:rgba(255,255,255,.02)}
.diag.bad{border-color:rgba(255,120,90,.35);background:rgba(255,120,90,.06)}
.diag.good{border-color:rgba(94,242,214,.3);background:rgba(94,242,214,.05)}
.diag-t{font-size:12.5px;font-weight:700;letter-spacing:.4px}
.diag.bad .diag-t{color:var(--coral)} .diag.good .diag-t{color:var(--mint)}
.diag-b{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:6px}
.diag-why{font-size:11px;color:var(--aqua);line-height:1.5;margin-top:7px;border-top:1px dashed var(--line);padding-top:7px}
.diag-rx{font-size:12px;color:var(--ink);margin-top:8px}
.diag-rx b{color:var(--mint)}
.dock-survey{justify-content:center;align-items:center;padding:12px 18px;max-width:720px}
.survey-hint{font-size:12.5px;color:var(--dim);line-height:1.5;text-align:center}
.survey-hint b{color:var(--ink)}
.abtn.back{min-width:104px;border-color:var(--line2)}
.abtn.back b{color:var(--aqua)}
.treat-row{max-width:520px}

/* ---------- accessibility ---------- */
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms!important;transition-duration:.001ms!important} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top" class="panel"></div>
<div id="left" class="panel"></div>
<div id="right" class="panel"></div>
<div id="dock" class="panel"></div>
<div id="zlab"></div>
<div id="overlay" class="overlay"></div>

<script>
/* data.js */
/* =====================================================================
   XENOSCOPE · data.js
   All game content: organelles (with real biology), organism kingdoms
   (incl. viruses & plant tissue), substances/reagents, tasks, ranks.
   Everything attaches to the global XS namespace so plain <script> tags
   work from file:// with no bundler.
===================================================================== */
window.XS = window.XS || {};
(function(XS){
"use strict";

/* ---------------- ORGANELLES & STRUCTURES ----------------
   Each entry teaches real biology. `fn` = function, `fact` = a hook.
   `col` drives its glow colour; `shape` picks a draw routine.
------------------------------------------------------------ */
XS.ORG = {
  membrane:      {name:'Cell membrane', col:'#8fe9ff', shape:'membrane',
    fn:'A partially-permeable barrier of phospholipids that controls what enters and leaves the cell.',
    fact:'Made of a phospholipid bilayer, “heads” love water, “tails” hide from it.'},
  wall_cellulose:{name:'Cell wall (cellulose)', col:'#7effc0', shape:'wall',
    fn:'A rigid cellulose box that supports the cell and stops it bursting when full of water.',
    fact:'Cellulose is the most abundant organic polymer on Earth.'},
  wall_chitin:   {name:'Cell wall (chitin)', col:'#ffd27a', shape:'wall',
    fn:'A tough chitin wall giving fungi their shape, the same material as insect shells.',
    fact:'Chitin makes fungi more chemically similar to insects than to plants.'},
  wall_pepti:    {name:'Cell wall (peptidoglycan)', col:'#9fd0ff', shape:'wall',
    fn:'A mesh of peptidoglycan around bacteria. Its thickness sets the Gram stain result.',
    fact:'Penicillin works by blocking peptidoglycan synthesis, so it hits bacteria, not you.'},
  wall_slayer:   {name:'S-layer wall', col:'#c8b0ff', shape:'wall',
    fn:'An archaeal surface layer of protein/glycoprotein. NO peptidoglycan, so wall-targeting antibiotics fail.',
    fact:'Because archaea lack peptidoglycan, penicillin does nothing to them.'},
  capsule:       {name:'Capsule', col:'#bfe0ff', shape:'halo',
    fn:'A slimy outer coat that protects some bacteria and helps them stick to surfaces.',
    fact:'Capsules help pathogens hide from the immune system.'},
  nucleus:       {name:'Nucleus', col:'#b79bff', shape:'nucleus',
    fn:'The control centre, it stores the DNA and directs the cell’s activities.',
    fact:'Only eukaryotes have a true, membrane-bound nucleus.'},
  nucleolus:     {name:'Nucleolus', col:'#d8c9ff', shape:'dot',
    fn:'A dense region inside the nucleus that builds ribosomes.',
    fact:'It vanishes during cell division and reforms afterwards.'},
  nucleoid:      {name:'Nucleoid', col:'#9fd0ff', shape:'nucleoid',
    fn:'The region of a prokaryote holding its single, circular chromosome, no membrane around it.',
    fact:'A bacterium’s DNA, unravelled, is ~1000× longer than the cell itself.'},
  plasmid:       {name:'Plasmid', col:'#7db8ff', shape:'ring',
    fn:'A small extra loop of DNA. Plasmids often carry antibiotic-resistance genes.',
    fact:'Bacteria swap plasmids like trading cards, spreading resistance fast.'},
  ribosome:      {name:'Ribosomes', col:'#dbeaff', shape:'speck',
    fn:'Tiny machines that read mRNA and build proteins.',
    fact:'Bacterial (70S) ribosomes differ from yours (80S), many antibiotics exploit that gap.'},
  mitochondrion: {name:'Mitochondria', col:'#ffb26a', shape:'mito',
    fn:'The powerhouse, aerobic respiration here releases energy (ATP) from glucose.',
    fact:'Mitochondria have their own DNA and were once free-living bacteria.'},
  chloroplast:   {name:'Chloroplast', col:'#7effc0', shape:'chloroplast',
    fn:'Where photosynthesis happens, light + CO₂ + water → glucose. Contains green chlorophyll.',
    fact:'Stacks of discs (grana) are packed with light-absorbing pigment.'},
  thylakoid:     {name:'Thylakoids', col:'#8fffb0', shape:'thylakoid',
    fn:'Folded photosynthetic membranes in cyanobacteria, a chloroplast’s ancestor did this first.',
    fact:'Cyanobacteria invented oxygen photosynthesis ~2.4 billion years ago.'},
  vacuole_central:{name:'Central vacuole', col:'#9ec8ff', shape:'bigvac',
    fn:'A large sap-filled sac that pushes outward, keeping the plant cell firm (turgid).',
    fact:'A wilting plant is one whose vacuoles have lost water and turgor.'},
  vacuole:       {name:'Vacuole', col:'#bcd8ff', shape:'vac',
    fn:'A storage sac for water, food or waste.',
    fact:'Fungal vacuoles help recycle nutrients across the cell.'},
  contractile:   {name:'Contractile vacuole', col:'#78ebff', shape:'contractile',
    fn:'A pump that collects and expels excess water, osmoregulation in freshwater protists.',
    fact:'Without it, a freshwater protist would swell and burst.'},
  food_vacuole:  {name:'Food vacuole', col:'#ffd9a0', shape:'foodvac',
    fn:'A bubble where engulfed food is digested by enzymes.',
    fact:'Formed when the cell wraps its membrane around a meal (phagocytosis).'},
  lysosome:      {name:'Lysosomes', col:'#ff7d92', shape:'lyso',
    fn:'Enzyme-filled sacs that digest worn-out parts and invaders, the cell’s recycling crew.',
    fact:'Their enzymes work best in acid; the cell keeps them safely bagged.'},
  er_rough:      {name:'Rough ER', col:'#c7b0ff', shape:'er',
    fn:'Ribosome-studded membranes that fold and transport newly-made proteins.',
    fact:'“Rough” because ribosomes give it a bumpy look.'},
  golgi:         {name:'Golgi apparatus', col:'#ffc9e6', shape:'golgi',
    fn:'Stacks that modify, package and ship proteins in vesicles, the cell’s post office.',
    fact:'Named after Camillo Golgi, who first saw it in 1898.'},
  cytoskeleton:  {name:'Cytoskeleton', col:'#bfe8e0', shape:'none',
    fn:'A protein scaffold giving the cell shape and moving things around inside.',
    fact:'It constantly builds and dismantles itself like scaffolding.'},
  flagellum:     {name:'Flagellum', col:'#9fe8ff', shape:'flagellum',
    fn:'A whip-like tail spun like a propeller to swim.',
    fact:'The bacterial flagellum is one of biology’s few true rotary motors.'},
  cilia:         {name:'Cilia', col:'#a8f0e0', shape:'cilia',
    fn:'Rows of tiny hairs that beat to move the cell or sweep in food.',
    fact:'Your airways use cilia to sweep out dust and mucus.'},
  pseudopod:     {name:'Pseudopodia', col:'#b0e0d0', shape:'pseudo',
    fn:'“False feet”, the cell flows part of itself out to crawl and to engulf prey.',
    fact:'Amoebae hunt by surrounding food with pseudopodia.'},
  pili:          {name:'Pili', col:'#bcd0ff', shape:'pili',
    fn:'Short hair-like fibres for sticking to surfaces and swapping DNA between bacteria.',
    fact:'A “sex pilus” lets one bacterium pass a plasmid to another.'},
  eyespot:       {name:'Eyespot', col:'#ff9a5c', shape:'eyespot',
    fn:'A pigmented light detector that steers some algae toward light.',
    fact:'Not a true eye, just enough to sense brightness and direction.'},
  spore:         {name:'Spores', col:'#ffcf8a', shape:'spore',
    fn:'Tough dormant units that survive harsh conditions and grow when things improve.',
    fact:'Some bacterial endospores survive boiling, and even space.'},
  septa:         {name:'Septa', col:'#ffdca0', shape:'none',
    fn:'Cross-walls dividing fungal threads (hyphae) into compartments.',
    fact:'Pores in septa let cytoplasm, and nuclei, flow between compartments.'},
  plasmodesmata:{name:'Plasmodesmata', col:'#a0ffcf', shape:'none',
    fn:'Tiny channels through plant cell walls that link neighbouring cells.',
    fact:'They let plant cells share water, signals and food directly.'},
  centriole:     {name:'Centrioles', col:'#c8d8ff', shape:'centriole',
    fn:'Barrel-shaped organisers that pull chromosomes apart during animal cell division.',
    fact:'Plants divide just fine without them.'},
  /* ---- plant vascular tissue ---- */
  xylem:         {name:'Xylem', col:'#bfe6ff', shape:'xylem',
    fn:'Dead, hollow, lignin-reinforced tubes carrying water and minerals UP from the roots.',
    fact:'Xylem cells are dead, the plant plumbs water through empty pipes.'},
  phloem:        {name:'Phloem', col:'#c8ffd6', shape:'phloem',
    fn:'Living sieve tubes carrying dissolved sugars around the plant (translocation).',
    fact:'Sap can flow up OR down phloem, wherever sugar is needed.'},
  /* ---- virus parts ---- */
  capsid:        {name:'Capsid', col:'#ff8fd0', shape:'capsid',
    fn:'A geometric protein shell that protects the viral genome.',
    fact:'Many capsids are icosahedra, 20 triangular faces.'},
  genome_dna:    {name:'Viral genome (DNA)', col:'#ff6ec7', shape:'coil',
    fn:'The virus’s genetic instructions, hijacking a host cell to copy them.',
    fact:'A virus carries genes but none of the machinery to run them.'},
  genome_rna:    {name:'Viral genome (RNA)', col:'#ff6ec7', shape:'coil',
    fn:'Single-stranded RNA instructions, fast-mutating, as in influenza and coronaviruses.',
    fact:'RNA viruses mutate quickly, which is why flu vaccines change yearly.'},
  envelope:      {name:'Viral envelope', col:'#ffb0e0', shape:'halo',
    fn:'An outer membrane stolen from a previous host cell; makes some viruses fragile to soap.',
    fact:'Soap dissolves the envelope, which is why hand-washing works.'},
  spike:         {name:'Glycoprotein spikes', col:'#ff9ad8', shape:'spike',
    fn:'Surface proteins that latch onto specific host-cell receptors, the key to the lock.',
    fact:'Spikes decide which cells a virus can infect.'},
  tail_fiber:    {name:'Tail fibres', col:'#ff9ad8', shape:'tail',
    fn:'Leg-like fibres a bacteriophage uses to land on and grip a bacterium.',
    fact:'A phage injects its DNA like a microscopic syringe.'},
};

/* ---------------- ORGANISM TYPES (six) ----------------
   `parts`: [organelleId, count]. `wall`, `wobble`, `aspect` drive looks.
   `autotroph`: null = random, true/false forces it.
------------------------------------------------------------ */
/* ---- XENO organelles: structures no Earth cell has ---- */
XS.ORG.lattice_node   = {name:'Lattice node', col:'#9ff0ea', shape:'lattice',
  fn:'A junction in a repeating silicon–oxygen framework. It is structural AND metabolic, reactions happen on the crystal faces themselves.',
  fact:'Silicon sits directly below carbon in the periodic table and also forms four bonds, but Si–O–Si chains are far more rigid, so a silicon organism is built, not grown.'};
XS.ORG.accretion_face = {name:'Accretion face', col:'#c7fbff', shape:'accretion',
  fn:'The growing edge of the crystal, where dissolved minerals are laid down. This organism gets bigger the way a stalactite does.',
  fact:'No cell division at all, it extends. "Reproduction" is a fragment breaking off and continuing to grow.'};
XS.ORG.plasma_core    = {name:'Plasma core', col:'#ff9ad5', shape:'plasmacore',
  fn:'A knot of ionised gas held together by its own magnetic field. There is no membrane, the field IS the boundary.',
  fact:'Plasma is the fourth state of matter and by far the most common in the universe; a self-organising magnetic structure is the loosest thing that could still be called "a body".'};
XS.ORG.field_line     = {name:'Confinement loop', col:'#ffd27a', shape:'fieldloop',
  fn:'A closed magnetic loop that traps charged particles and keeps the organism from dissipating.',
  fact:'Cool it or short the loop and the whole structure simply disperses, you do not kill it so much as switch it off.'};
XS.ORG.ammonia_vac    = {name:'Ammonia vacuole', col:'#a9ddff', shape:'ammoniavac',
  fn:'The internal reservoir of liquid ammonia that serves as this cell’s solvent, exactly as water does in ours.',
  fact:'Ammonia stays liquid from −78 °C to −33 °C, so an ammonia biochemistry runs in a temperature range that would freeze us solid.'};
XS.ORG.metal_crust    = {name:'Metal-oxide crust', col:'#b9a37a', shape:'oxidecrust',
  fn:'An armoured shell of precipitated iron and manganese oxides, laid down as a by-product of respiration.',
  fact:'Earth has a faint echo of this, iron-oxidising bacteria build rusty sheaths, but here the metal is the whole skeleton.'};
XS.ORG.redox_vent     = {name:'Redox vent', col:'#ffb454', shape:'redoxvent',
  fn:'A pore where dissolved metal ions are oxidised for energy. This organism eats rock, not light or food.',
  fact:'Chemolithotrophy, literally "rock eating", needs no sunlight at all, which is why it is a favourite hypothesis for life beneath other worlds’ ice.'};

XS.KINGDOMS = {
  Animalia:{label:'Animal', col:[255,143,163], wall:'none', wobble:.10, aspect:1.1, nucleus:true, virus:false,
    gen:['Xeno','Vermi','Predo','Cnido','Necro'], epi:['zoon','pod','vermis','cnidos','fera'],
    autotroph:false,
    parts:[['membrane',1],['nucleus',1],['nucleolus',1],['mitochondrion',5],['er_rough',1],['golgi',1],['lysosome',4],['centriole',1],['ribosome',12]],
    blurb:'No cell wall, no chloroplasts, a heterotroph that eats other organisms for energy.'},
  Plantae:{label:'Plant', col:[126,255,192], wall:'cellulose', wobble:.03, aspect:1.05, nucleus:true, virus:false,
